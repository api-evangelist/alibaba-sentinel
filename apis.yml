apis:
  - aid: alibaba-sentinel:sentinel-dashboard-api
    name: Sentinel Dashboard API
    description: >-
      The Sentinel Dashboard API provides a REST interface for the Sentinel
      dashboard application, which allows real-time monitoring of clients and
      dynamic configuration of flow control, circuit breaking, and system
      protection rules. The dashboard supports cluster aggregation of runtime
      info for up to 500 nodes and enables operators to manage resources and
      rules without application restarts.
    humanURL: https://sentinelguard.io/en-us/docs/dashboard.html
    baseURL: https://localhost:8080
