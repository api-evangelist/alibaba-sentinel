openapi: 3.0.3
info:
  title: Alibaba Sentinel Dashboard Authority Rules System Rules API
  description: REST API for the Sentinel Dashboard providing management of flow rules, degrade rules, system rules, and authority rules for resources.
  version: 1.8.0
  contact:
    name: Alibaba Sentinel
    url: https://github.com/alibaba/Sentinel
servers:
- url: http://localhost:8080
  description: Default Sentinel Dashboard
tags:
- name: System Rules
paths:
  /v1/system/rules:
    get:
      operationId: getSystemRules
      summary: Get system protection rules
      tags:
      - System Rules
      parameters:
      - name: app
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of system rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
components:
  schemas:
    ApiResult:
      type: object
      properties:
        code:
          type: integer
          description: Response code (200 for success)
        msg:
          type: string
          description: Response message
        data:
          description: Response data payload
