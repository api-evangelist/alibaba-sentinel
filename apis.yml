aid: alibaba-sentinel
name: Alibaba Sentinel
description: >-
  Alibaba Sentinel is a powerful open source flow control component enabling
  reliability, resilience, and monitoring for microservices. Originally
  developed by Alibaba and used in production at Alibaba for over 10 years,
  Sentinel provides flow control, traffic shaping, concurrency limiting, circuit
  breaking, and system adaptive overload protection. The project is written
  primarily in Java with a Go implementation (sentinel-golang) also available.
  Sentinel integrates with major frameworks including Spring Cloud, Dubbo,
  gRPC, Apache RocketMQ, and Servlet. It provides a real-time monitoring
  dashboard for visualizing metrics and configuring rules dynamically. The
  project is hosted on GitHub under the Alibaba organization and is widely
  adopted in cloud-native microservice architectures.
type: Index
